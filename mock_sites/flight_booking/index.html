<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyBook - Flight Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f2f5; }
    header { background: #0d47a1; color: white; padding: 16px 24px; }
    header h1 { font-size: 22px; }
    .search-panel { background: white; max-width: 900px; margin: 24px auto; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .search-panel h2 { margin-bottom: 16px; }
    .trip-type { margin-bottom: 16px; display: flex; gap: 16px; }
    .trip-type label { cursor: pointer; font-size: 14px; }
    .form-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .form-group { flex: 1; min-width: 150px; }
    .form-group label { display: block; margin-bottom: 4px; font-size: 13px; color: #555; font-weight: 500; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    .passengers { display: flex; align-items: center; gap: 8px; }
    .passengers button { width: 32px; height: 32px; border: 1px solid #ddd; border-radius: 4px; background: white; cursor: pointer; font-size: 18px; }
    .passengers span { font-size: 16px; min-width: 20px; text-align: center; }
    .search-btn { width: 100%; padding: 12px; background: #0d47a1; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    /* Results */
    #results-panel { display: none; max-width: 900px; margin: 0 auto 24px; }
    #results-panel h2 { margin-bottom: 16px; }
    .sort-bar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
    .sort-bar label { font-size: 14px; }
    .sort-bar select { padding: 6px; border: 1px solid #ddd; border-radius: 4px; }
    .flight-card { background: white; padding: 16px; border-radius: 8px; margin-bottom: 12px; display: flex; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .flight-info { flex: 1; }
    .flight-info .airline { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
    .flight-info .times { font-size: 14px; color: #333; }
    .flight-info .duration { font-size: 13px; color: #888; }
    .flight-info .stops { font-size: 13px; color: #e65100; }
    .flight-price { text-align: right; min-width: 120px; }
    .flight-price .price { font-size: 22px; font-weight: bold; color: #0d47a1; }
    .flight-price button { margin-top: 8px; padding: 8px 16px; background: #0d47a1; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    /* Confirmation */
    #confirm-panel { display: none; max-width: 600px; margin: 40px auto; background: white; padding: 32px; border-radius: 8px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    #confirm-panel h2 { color: #2e7d32; margin-bottom: 16px; }
    .booking-details { text-align: left; background: #f5f5f5; padding: 16px; border-radius: 4px; margin: 16px 0; }
    .booking-details p { margin: 4px 0; font-size: 14px; }
  </style>
</head>
<body>
  <header><h1>SkyBook</h1></header>

  <div class="search-panel" id="search-panel">
    <h2>Search Flights</h2>
    <div class="trip-type">
      <label><input type="radio" name="trip" value="roundtrip" checked> Round Trip</label>
      <label><input type="radio" name="trip" value="oneway"> One Way</label>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="from-city">From</label>
        <select id="from-city" aria-label="Departure city">
          <option value="">Select city</option>
          <option value="SFO">San Francisco (SFO)</option>
          <option value="NYC">New York (JFK)</option>
          <option value="LAX">Los Angeles (LAX)</option>
          <option value="CHI">Chicago (ORD)</option>
          <option value="SEA">Seattle (SEA)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="to-city">To</label>
        <select id="to-city" aria-label="Arrival city">
          <option value="">Select city</option>
          <option value="LON">London (LHR)</option>
          <option value="TYO">Tokyo (NRT)</option>
          <option value="PAR">Paris (CDG)</option>
          <option value="SYD">Sydney (SYD)</option>
          <option value="DXB">Dubai (DXB)</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="depart-date">Departure</label>
        <input type="date" id="depart-date" aria-label="Departure date">
      </div>
      <div class="form-group">
        <label for="return-date">Return</label>
        <input type="date" id="return-date" aria-label="Return date">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Passengers</label>
        <div class="passengers">
          <button onclick="changePax(-1)" aria-label="Decrease passengers">-</button>
          <span id="pax-count">1</span>
          <button onclick="changePax(1)" aria-label="Increase passengers">+</button>
        </div>
      </div>
      <div class="form-group">
        <label for="cabin-class">Class</label>
        <select id="cabin-class" aria-label="Cabin class">
          <option value="economy">Economy</option>
          <option value="business">Business</option>
          <option value="first">First</option>
        </select>
      </div>
    </div>
    <button class="search-btn" onclick="searchFlights()" aria-label="Search flights">Search Flights</button>
  </div>

  <div id="results-panel">
    <h2>Available Flights</h2>
    <div class="sort-bar">
      <label for="sort-by">Sort by:</label>
      <select id="sort-by" onchange="sortResults()" aria-label="Sort results">
        <option value="price">Price (Low to High)</option>
        <option value="duration">Duration (Shortest)</option>
        <option value="departure">Departure Time</option>
      </select>
      <label for="stops-filter" style="margin-left:16px;">Stops:</label>
      <select id="stops-filter" onchange="filterResults()" aria-label="Filter by stops">
        <option value="any">Any</option>
        <option value="0">Nonstop only</option>
        <option value="1">1 stop max</option>
      </select>
    </div>
    <div id="flight-results"></div>
  </div>

  <div id="confirm-panel">
    <h2>Booking Confirmed!</h2>
    <p>Your flight has been booked successfully.</p>
    <div class="booking-details" id="booking-details"></div>
  </div>

  <script>
    let paxCount = 1;
    const flights = [
      { airline: "AirGlobal", from: "SFO", to: "TYO", depart: "08:30", arrive: "15:45+1", duration: "11h 15m", stops: 0, price: 892 },
      { airline: "Pacific Wings", from: "SFO", to: "TYO", depart: "11:00", arrive: "20:30+1", duration: "13h 30m", stops: 1, stopCity: "HNL", price: 654 },
      { airline: "SkyBridge", from: "SFO", to: "TYO", depart: "14:15", arrive: "22:00+1", duration: "11h 45m", stops: 0, price: 1045 },
      { airline: "BudgetAir", from: "SFO", to: "TYO", depart: "22:00", arrive: "12:30+2", duration: "16h 30m", stops: 2, stopCity: "SEA, HNL", price: 489 },
      { airline: "AirGlobal", from: "SFO", to: "TYO", depart: "16:45", arrive: "04:15+2", duration: "15h 30m", stops: 1, stopCity: "LAX", price: 723 },
      { airline: "JetStream", from: "SFO", to: "TYO", depart: "06:00", arrive: "13:00+1", duration: "11h 00m", stops: 0, price: 978 },
    ];

    let currentFlights = [...flights];

    function changePax(delta) {
      paxCount = Math.max(1, Math.min(9, paxCount + delta));
      document.getElementById('pax-count').textContent = paxCount;
    }

    function searchFlights() {
      document.getElementById('search-panel').style.display = 'none';
      document.getElementById('results-panel').style.display = 'block';
      sortResults();
    }

    function sortResults() {
      const sortBy = document.getElementById('sort-by').value;
      currentFlights.sort((a, b) => {
        if (sortBy === 'price') return a.price - b.price;
        if (sortBy === 'duration') return parseInt(a.duration) - parseInt(b.duration);
        return a.depart.localeCompare(b.depart);
      });
      filterResults();
    }

    function filterResults() {
      const maxStops = document.getElementById('stops-filter').value;
      let filtered = currentFlights;
      if (maxStops !== 'any') {
        filtered = currentFlights.filter(f => f.stops <= parseInt(maxStops));
      }
      renderFlights(filtered);
    }

    function renderFlights(list) {
      const container = document.getElementById('flight-results');
      container.innerHTML = list.map((f, i) => `
        <div class="flight-card" role="listitem">
          <div class="flight-info">
            <div class="airline">${f.airline}</div>
            <div class="times">${f.depart} → ${f.arrive}</div>
            <div class="duration">${f.duration}</div>
            <div class="stops">${f.stops === 0 ? 'Nonstop' : f.stops + ' stop' + (f.stops > 1 ? 's' : '') + (f.stopCity ? ' (' + f.stopCity + ')' : '')}</div>
          </div>
          <div class="flight-price">
            <div class="price">$${f.price * paxCount}</div>
            <div style="font-size:12px;color:#888">${paxCount > 1 ? paxCount + ' passengers' : 'per person'}</div>
            <button onclick="bookFlight('${f.airline}', '${f.depart}', ${f.price})" aria-label="Select ${f.airline} flight at $${f.price * paxCount}">Select</button>
          </div>
        </div>
      `).join('');
    }

    function bookFlight(airline, depart, price) {
      document.getElementById('results-panel').style.display = 'none';
      const panel = document.getElementById('confirm-panel');
      panel.style.display = 'block';
      const from = document.getElementById('from-city').value;
      const to = document.getElementById('to-city').value;
      const cabin = document.getElementById('cabin-class').value;
      const dep = document.getElementById('depart-date').value;
      document.getElementById('booking-details').innerHTML = `
        <p><strong>Airline:</strong> ${airline}</p>
        <p><strong>Route:</strong> ${from} → ${to}</p>
        <p><strong>Date:</strong> ${dep}</p>
        <p><strong>Departure:</strong> ${depart}</p>
        <p><strong>Passengers:</strong> ${paxCount}</p>
        <p><strong>Class:</strong> ${cabin}</p>
        <p><strong>Total Price:</strong> $${price * paxCount}</p>
      `;
      panel.dataset.airline = airline;
      panel.dataset.price = price * paxCount;
      panel.dataset.from = from;
      panel.dataset.to = to;
      panel.dataset.cabin = cabin;
      panel.dataset.pax = paxCount;
    }
  </script>
</body>
</html>
